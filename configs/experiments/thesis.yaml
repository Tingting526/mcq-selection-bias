name: thesis-canonical-v2
seed: 42
batch_size: 4
flush_every_batches: 10
core_models:
  - llama-3.1-8b-instruct
  - qwen2.5-7b-instruct
  - gemma-2-9b-it
prompt:
  version: thesis-mcq-v2
  instruction: |-
    Answer the following multiple-choice question.
    Respond with only the option letter (A, B, C, or D).
  question_heading: "Question:"
  answer_heading: "Answer:"
pride:
  alpha: 0.05
  candidate_alphas: [0.01, 0.02, 0.05, 0.10, 0.20]
  alpha_rounding: floor
  minimum_estimation_samples: 1
  sampling_order: sorted_sample_id
  epsilon: 1.0e-12
  estimation_sample_policy: cyclic
  primary_seed: 42
  sensitivity_seeds: [42, 43, 44, 45, 46]
  equal_budget_sensitivity:
    enabled: true
    sample_count: 63
    nesting_policy: prefix_of_seeded_estimation_order
analysis:
  primary_pride_metrics:
    - accuracy_default_order
    - rstd_original
  primary_pride_contrasts:
    - in_domain_minus_default
    - transfer_minus_default
    - transfer_minus_in_domain
  secondary_corrected_cyclic_metrics:
    - mean_accuracy
    - rstd_cyclic
    - semantic_consistency
  bootstrap:
    replicates: 1000
    confidence_level: 0.95
    paired_by_question: true
experimental:
  identical_content_prior_enabled: false
